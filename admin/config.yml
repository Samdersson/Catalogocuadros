backend:
  name: github
  repo: Samdersson/Catalogocuadros
  branch: main
  site_domain: catalogo-cuadros.netlify.app

# 🚀 CONFIGURACIÓN DE IMÁGENES
media_folder: "imagenes"
public_folder: "imagenes"

# Configuración del gestor de medios para optimizar y usar WebP
# media_library:
#   name: cloudinary
#   config:
#     default_transformations:
#       - fetch_format: "auto" # Sirve formato WebP/AVIF según el navegador
#         quality: "auto"      # Comprime calidad sin perder nitidez HD

collections:
  - name: "cuadros"
    label: "Catálogo de Cuadros"
    files:
      - file: "cuadros.json"
        label: "Lista de Cuadros"
        name: "cuadros_data"
        fields:
          - label: "Cuadros"
            name: "cuadros"
            widget: "list"
            fields:
              - { label: "ID Único", name: "id", widget: "string", hint: "Ejemplo: ref-0659" }
              - { label: "Título del Cuadro", name: "titulo", widget: "string" }
              
              - label: "Tipo de Producto"
                name: "tipo"
                widget: "select"
                default: "sin_luz"
                options:
                  - { label: "Sin Luz LED (Cuadro Completo / Tríptico)", value: "sin_luz" }
                  - { label: "Con Luz LED Neon", value: "con_luz" }

              - label: "Número de Piezas"
                name: "piezas"
                widget: "select"
                default: 1
                value_type: "int"
                options:
                  - { label: "1 Pieza (Completo / LED)", value: 1 }
                  - { label: "3 Piezas (Tríptico)", value: 3 }
                  - { label: "5 Piezas (Políptico)", value: 5 }

              # 🖼️ CAMPO DE IMAGEN: Configurado para salida en WebP
              - label: "Imagen Principal"
                name: "imagen"
                widget: "image"
                output_format: "webp"

              - label: "Etiquetas / Categorías"
                name: "etiquetas"
                widget: "list"
                field: { label: "Etiqueta", name: "tag", widget: "string" }